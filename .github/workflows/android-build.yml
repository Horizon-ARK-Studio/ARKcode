# Builds the Android shell described in android-project/README.md.
# GitHub Actions only discovers workflow files at a repo's top level,
# which is why this lives here instead of under android-project/.
#
# What this does, per product flavor declared in
# android-project/app/build.gradle.kts (youtube, template, and any
# new flavor added later -- the matrix below is the only place that
# needs a new entry when a flavor is added):
#   1. assembles a debug APK, signed with the org's shared debug
#      keystore when configured (falls back to Gradle's own implicit
#      auto-generated ~/.android/debug.keystore otherwise)
#   2. smoke-tests it: boots a headless emulator, installs the APK,
#      launches it, and fails the job if it crashes on launch
#
# Release builds are on hold for now -- see the `release` job removed
# from this file's history if/when that's picked back up.
#
# Optional signing secrets (Settings -> Secrets and variables ->
# Actions, org-level). Debug builds fall back to Gradle's own
# auto-generated debug keystore when these aren't set; they're picked
# up automatically once they are:
#   DEBUG_KEYSTORE_BASE64    -- your .jks/.keystore file, base64-encoded
#   DEBUG_KEYSTORE_PASSWORD
#   DEBUG_KEYSTORE_ALIAS
#   DEBUG_KEY_PASSWORD

name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android-project

jobs:
  debug-and-smoke-test:
    name: Debug build + smoke test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [youtube, template, vscode]
    env:
      # `secrets` isn't a valid context inside `if:` expressions, so the
      # presence check goes through `env:` (which can reference secrets)
      # instead of testing secrets.DEBUG_KEYSTORE_BASE64 directly below.
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Decode the org's shared debug keystore only if it's configured.
      # DEBUG_KEYSTORE_PATH being unset/empty is exactly what
      # build.gradle.kts's isNullOrBlank() check falls back on to use
      # Gradle's own implicit debug keystore instead.
      - name: Decode debug keystore
        if: ${{ env.HAS_DEBUG_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Assemble ${{ matrix.flavor }} debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEYSTORE_ALIAS: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew "assemble${{ matrix.flavor }}Debug" --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk -iname "*${{ matrix.flavor }}*debug*.apk" | head -n1)
          echo "path=$(realpath "$apk")" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arkware-${{ matrix.flavor }}-debug
          path: ${{ steps.apk.outputs.path }}

      # Smoke test: install + launch on a headless AVD. Enable KVM so
      # the emulator isn't running fully software-rendered on the
      # GitHub-hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: >
            package=$(cd android-project && ./gradlew -q "printApplicationId${{ matrix.flavor }}Debug" 2>/dev/null || echo "com.horizonarkstudio.arkware.${{ matrix.flavor }}") &&
            adb install -r "${{ steps.apk.outputs.path }}" &&
            adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 &&
            sleep 5 &&
            adb shell dumpsys activity activities | grep -q "$package" || (echo "::error::$package did not come to the foreground after launch" && exit 1)
