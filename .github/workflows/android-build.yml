name: Android build

# Builds a debug APK on GitHub-hosted runners on every push/PR, and
# installs and launches it on a throwaway emulator on the same runner
# to confirm it doesn't crash immediately -- see
# ANDROID-BACKEND-IMPLEMENTATION.md, Stages 2 and 3. Requires no JDK,
# Android SDK, or emulator/device on your own machine for either job;
# all of it lives on the runner.
#
# Progress note (this patch, VSCODE-IDE-IMPLEMENTATION-PLAN.md Phase 6):
# the frontend (code-server's workbench + server bundle) and the
# Termux-built shared libraries libnode.so needs (BUG-0002) are
# build-time dependencies, not something this repo git-vendors -- see
# scripts/vendor-code-server.sh, scripts/vendor-code-server-server.sh,
# scripts/vendor-termux-libs.sh's own headers. Before this patch,
# "build-time" meant "manual, run by hand, before you invoke Gradle" --
# nothing actually ran them here, so `assemble-debug` always produced
# an APK, and `install-launch-smoke-test` always passed (BUG-0001's
# crash-proofing means IdeBackendState.Failed keeps the app process
# alive same as IdeBackendState.Ready does -- pidof can't tell them
# apart), regardless of whether the IDE backend inside that APK could
# ever actually start. See BUG-0003 in docs/bugs-caught/README.md.
#
# This patch makes "build time" mean *this workflow*, on a runner with
# open internet (this project's own sandbox that authored
# build-libnode.yml deliberately does not have it -- see that
# workflow's header): `assemble-debug` now runs all three vendor
# scripts itself before `gradle assembleDebug`, and best-effort pulls
# the latest successful `libnode-jniLibs` artifact from
# build-libnode.yml (that workflow's own multi-hour NDK cross-build
# stays separate and manual-dispatch -- this only ever *consumes* its
# artifact, never re-runs it). `install-launch-smoke-test` then reads
# logcat for the actual IdeBackendState transition instead of just
# checking the process is alive, so a real Ready/Failed/crash outcome
# is what gates CI green now, not just "didn't crash".
on:
  push:
    # main is this repo's default branch, but all of this project's
    # actual work has been happening on app -- branches: [main] alone
    # meant every push here since this workflow moved to the repo
    # root (4c287cc) silently never triggered a run. Add app so
    # pushes here actually fire the workflow; keep main too so it
    # still fires once/if this branch gets merged there.
    branches: [main, app]
  pull_request:
  workflow_dispatch:

# settings.gradle.kts / build.gradle.kts / app/ all live under
# android-project/, not the repo root -- every `run:` step below
# needs to execute there, or there's no Gradle build for `gradle` to
# find at all.
defaults:
  run:
    working-directory: android-project

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---- build-time vendoring (frontend + Termux shared libs) ----
      #
      # Both scripts fetch from github.com/codeload.github.com /
      # packages.termux.dev -- all reachable from this runner, none
      # reachable from the sandbox that wrote these scripts (see this
      # file's header). Manual-run-by-hand was never the goal, just
      # the state before this patch wired them in here.
      - name: Vendor code-server workbench (frontend)
        run: |
          chmod +x scripts/vendor-code-server.sh
          ./scripts/vendor-code-server.sh

      - name: Vendor code-server server bundle (entry.js + node_modules)
        run: |
          chmod +x scripts/vendor-code-server-server.sh
          ./scripts/vendor-code-server-server.sh

      - name: Vendor libnode.so's Termux shared-library dependencies
        run: |
          chmod +x scripts/vendor-termux-libs.sh
          ./scripts/vendor-termux-libs.sh

      # ---- best-effort libnode.so pickup from build-libnode.yml ----
      #
      # build-libnode.yml's own NDK cross-build takes on the order of
      # hours per ABI (see that workflow's header) -- nowhere near
      # something to re-run on every push here. This step only
      # *consumes* its most recent successful artifact, if one
      # exists; jniLibs/arm64-v8a/libnode.so already committed to this
      # repo (ed11de5) stays as the fallback for that one ABI if no
      # artifact is found or the download fails, and armeabi-v7a/
      # x86_64 simply stay absent -- REQUIRED_NATIVE_LIBS verification
      # below reports that state rather than silently proceeding on
      # incomplete ABI coverage.
      - name: Fetch latest libnode.so build (if one exists)
        id: fetch_libnode
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-libnode.yml
          workflow_conclusion: success
          name: libnode-jniLibs
          # This action's `path` is resolved against GITHUB_WORKSPACE,
          # NOT this job's `defaults.run.working-directory` (that
          # default only applies to `run:` shell steps, not `uses:`
          # steps) -- android-project/ prefix needed here, but NOT in
          # the next (`run:`) step below, which is already cwd'd there.
          path: android-project/fetched-jniLibs
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Overlay fetched libnode.so into jniLibs/
        if: steps.fetch_libnode.outcome == 'success'
        run: |
          set -eu
          if [ -d fetched-jniLibs ]; then
            echo "Overlaying fetched libnode.so build(s) onto app/src/main/jniLibs/:"
            cp -rv fetched-jniLibs/. app/src/main/jniLibs/
          else
            echo "::warning::libnode-jniLibs artifact download reported success but fetched-jniLibs/ is empty -- nothing to overlay."
          fi

      # ---- verification: report what's actually present, don't guess ----
      #
      # Mirrors IdeBackendService.REQUIRED_NATIVE_LIBS exactly (see
      # that companion object) -- keep the two lists in sync by hand;
      # there's no single source both Kotlin and this YAML can read
      # from without adding a build step just to generate one, which
      # isn't worth it for an 8-line list. Non-fatal: Gradle doesn't
      # need any of this to compile, and a Kotlin-only change to this
      # repo shouldn't be blocked on a libnode.so build landing.
      # install-launch-smoke-test below is what actually turns
      # "missing" into a build-visible outcome, since that's the job
      # that can tell what it costs at runtime.
      - name: Report vendored-artifact status
        run: |
          set -u
          echo "## Vendored artifact status" >> "$GITHUB_STEP_SUMMARY"
          MISSING=0

          ENTRY_JS="app/src/main/assets/code-server/out/node/entry.js"
          if [ -f "$ENTRY_JS" ]; then
            echo "- ✅ code-server server bundle (\`$ENTRY_JS\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ code-server server bundle missing (\`$ENTRY_JS\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::code-server server bundle missing at $ENTRY_JS -- IdeBackendService will fail fast with 'entry.js missing'."
            MISSING=1
          fi

          WORKBENCH="app/src/main/assets/code-server/lib/vscode/out/vs"
          if [ -d "$WORKBENCH" ]; then
            echo "- ✅ code-server workbench frontend (\`$WORKBENCH\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ code-server workbench frontend missing (\`$WORKBENCH\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::code-server workbench missing at $WORKBENCH."
            MISSING=1
          fi

          # icui18n/icuuc are checked via a version-suffix glob, not an
          # exact filename: Termux's libicu package is a rolling
          # release (ICU bumps its SONAME roughly twice a year) and
          # scripts/vendor-termux-libs.sh already vendors whatever
          # version is current at fetch time. A hardcoded ".so.78"
          # here previously false-flagged as "missing" once Termux's
          # actual ICU version moved past 78. Kept in sync by hand with
          # IdeBackendService.REQUIRED_NATIVE_LIBS, same as the rest of
          # this list already was.
          REQUIRED_NATIVE_LIBS_FIXED="libz.so.1 libcares.so libsqlite3.so libcrypto.so.3 libssl.so.3 libc++_shared.so"
          REQUIRED_NATIVE_LIBS_GLOB="libicui18n.so.* libicuuc.so.*"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            DIR="app/src/main/jniLibs/$ABI"
            if [ -f "$DIR/libnode.so" ]; then
              echo "- ✅ $ABI/libnode.so" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⬜ $ABI/libnode.so not present (no build-libnode.yml artifact for this ABI yet)" >> "$GITHUB_STEP_SUMMARY"
              continue # no point checking this ABI's shared-lib deps if libnode.so itself isn't there
            fi
            for LIB in $REQUIRED_NATIVE_LIBS_FIXED; do
              if [ -f "$DIR/$LIB" ]; then
                echo "  - ✅ $ABI/$LIB" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "  - ❌ $ABI/$LIB missing" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::$DIR is missing $LIB -- IdeBackendService.launchNode() will fail its REQUIRED_NATIVE_LIBS preflight check for $ABI."
                MISSING=1
              fi
            done
            for PATTERN in $REQUIRED_NATIVE_LIBS_GLOB; do
              MATCH="$(find "$DIR" -maxdepth 1 -name "$PATTERN" | head -n1)"
              if [ -n "$MATCH" ]; then
                echo "  - ✅ $ABI/$(basename "$MATCH")" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "  - ❌ $ABI/$PATTERN missing" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::$DIR is missing a file matching $PATTERN -- IdeBackendService.launchNode() will fail its REQUIRED_NATIVE_LIBS preflight check for $ABI."
                MISSING=1
              fi
            done
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**At least one build-time artifact is missing.** The APK will still assemble and install, but \`install-launch-smoke-test\` is expected to observe \`IdeBackendState.Failed\` rather than \`Ready\` until this is resolved -- see the warnings above for exactly what's absent." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKware-IDE-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  install-launch-smoke-test:
    name: Install + launch on an emulator
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ARKware-IDE-debug-apk
          path: apk

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -u
            adb logcat -c
            APK="$(find apk -name '*.apk' | head -n 1)"
            adb install -r "$APK"
            adb shell am start -n com.arkware.ide/com.arkware.ide.MainActivity

            # BUG-0003 (docs/bugs-caught/README.md): a plain `pidof`
            # check can't distinguish IdeBackendState.Ready from
            # IdeBackendState.Failed -- BUG-0001's own crash-proofing
            # fix means the process survives either one identically.
            # Poll logcat for the actual state transition instead,
            # which is what MainActivity.onBackendState() /
            # IdeBackendService.fail() already log distinctly. Ready
            # only on the x86_64 emulator ABI, which build-libnode.yml
            # does build for -- this can go green end to end once that
            # workflow has produced an x86_64 artifact for
            # assemble-debug to have picked up above; until then,
            # Failed is the CORRECT (not a bug) observed outcome, and
            # this step reports it as PASS with that caveat, not as a
            # failure -- see the "Failed vs crashed" distinction below.
            OUTCOME=""
            REASON=""
            for i in $(seq 1 24); do
              if ! adb shell pidof com.arkware.ide > /dev/null; then
                OUTCOME="crashed"
                break
              fi
              READY_LINE="$(adb logcat -d -s MainActivity:D | grep -F 'backend ready on port' | tail -n1 || true)"
              if [ -n "$READY_LINE" ]; then
                OUTCOME="ready"
                REASON="$READY_LINE"
                break
              fi
              FAILED_LINE="$(adb logcat -d -s MainActivity:E | grep -F 'backend failed to start' | tail -n1 || true)"
              if [ -n "$FAILED_LINE" ]; then
                OUTCOME="failed"
                REASON="$FAILED_LINE"
                break
              fi
              sleep 2
            done

            case "$OUTCOME" in
              ready)
                echo "PASS: backend reached IdeBackendState.Ready -- $REASON"
                ;;
              failed)
                echo "PASS (with caveat): app did not crash, but the backend reported IdeBackendState.Failed, not Ready:"
                echo "  $REASON"
                echo "This is the expected outcome whenever a build-time artifact from this workflow's earlier 'Report vendored-artifact status' step is missing for the x86_64 ABI (see that step's job summary) -- it is a real, correctly-surfaced failure of the IDE backend, not a smoke-test bug. Once build-libnode.yml has produced an x86_64 libnode.so (plus its REQUIRED_NATIVE_LIBS) for assemble-debug to pick up, this should observe 'ready' instead."
                ;;
              crashed)
                echo "::error::App process not found -- it crashed outright (not even reaching IdeBackendState.Failed's UI). See logcat below."
                adb logcat -d "*:E"
                exit 1
                ;;
              *)
                echo "::error::Neither a Ready nor a Failed state was observed in logcat within the poll window, and the process is still alive -- MainActivity/IdeBackendService never reached either terminal state. See full logcat below."
                adb logcat -d
                exit 1
                ;;
            esac
