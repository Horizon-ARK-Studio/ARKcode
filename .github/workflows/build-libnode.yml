---
name: Build libnode.so

# Actually *runs* the nodejs-lts recipe -- fetched fresh at the start
# of this job by scripts/vendor-termux-recipe.sh (not read from a
# git-vendored copy; see that script's own header for why) -- see
# android-project/build/termux-recipe/README.md (generated by that
# same script) for "what this is not: not runnable as-is" -- inside
# termux-packages' own Docker build environment, once per ABI this
# project ships (app/build.gradle.kts' abiFilters: arm64-v8a,
# armeabi-v7a, x86_64), and uploads the resulting Node binary (renamed
# libnode.so per VSCODE-IDE-IMPLEMENTATION-PLAN.md section 4.1),
# together with that same ABI's libnode.so shared-library dependencies
# (BUG-0002 -- fetched per-arch by scripts/vendor-termux-libs.sh,
# invoked once per matrix entry below) as a single flat per-ABI
# workflow artifact.
#
# Why this is its own workflow, not a job in android-build.yml:
# nodejs-lts/build.sh's own top-of-file comment says a from-scratch
# build "takes 2 whole hours... for a single arch" — times three ABIs
# that's multiple hours, an order of magnitude past what should block
# every ordinary push/PR. This only runs on manual dispatch.
#
# Why this can't run in the sandbox that authored this workflow: it
# needs a real Android NDK plus the host LLVM toolchain termux-packages
# downloads itself (see nodejs-lts/build.sh's termux_step_host_build),
# and that sandbox's network egress allowlist doesn't cover
# termux-packages' package servers, GitHub raw/codeload, or Google's
# chromium-browser-clang bucket. GitHub-hosted runners have open
# internet, so it can run there.
#
# What this does NOT do: commit the resulting files anywhere, or wire
# them into android-build.yml's Gradle build directly -- that's
# android-build.yml's own "Fetch latest libnode.so build" step's job
# (best-effort, consumes the `bundle` job's `libnode-jniLibs` artifact
# below), not this workflow's. libnode.so per ABI easily runs
# 80-150MB — dropping that into git history via an automated commit
# is its own decision (Git LFS or a release asset, not a regular
# commit) that deserves a deliberate choice, not one made silently by
# a workflow run.
#
# Known unknowns, since this has not yet been run for real:
# - Whether 350 minutes is actually enough. GitHub-hosted runners hard
#   -cap every job at 360 minutes regardless of plan; if the real
#   build runs longer than that per ABI, this job gets killed with no
#   partial-progress artifact and the only fixes are a self-hosted
#   runner or splitting the recipe's steps (host build / cross build)
#   across separate jobs with a cache/artifact handoff between them —
#   not attempted here.
# - Whether the GitHub-hosted runner's default disk (~14GB free after
#   the OS/toolchain preinstalls) is enough once ICU, the LLVM host
#   toolchain tarball, and a full V8 build's object files are all on
#   disk at once. The "Free up disk space" step below is a best-effort
#   mitigation, not a guarantee.
# - Whether the fetched recipe's patches (pinned to termux-packages
#   commit 9010030e, see scripts/vendor-termux-recipe.sh's
#   TERMUX_PACKAGES_COMMIT) still apply cleanly against that same
#   pinned commit's build-package.sh infrastructure. Pinning both
#   fetches (the recipe below, and the rest of termux-packages via
#   TERMUX_PACKAGES_COMMIT two steps down) to the same exact commit --
#   rather than termux-packages' master -- is deliberate, to keep this
#   reproducible and to avoid a divergence between "the recipe we
#   fetched" and "the build system we run it with".

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which ABI to build (all three takes hours)"
        type: choice
        default: all
        options:
          - all
          - aarch64 # -> arm64-v8a
          - arm # -> armeabi-v7a
          - x86_64 # -> x86_64

# termux-packages' own build-package.sh recipe format is what's being
# invoked — this pin matches scripts/vendor-termux-recipe.sh's own
# TERMUX_PACKAGES_COMMIT (see that script's generated
# build/termux-recipe/README.md "Licensing" section for the same hash
# used there), kept in sync deliberately so the recipe fetched below
# and the rest of termux-packages fetched here never drift apart.
env:
  TERMUX_PACKAGES_COMMIT: 9010030e71dbb22d8d5fffad8d6e6bc84155a23b

jobs:
  plan:
    name: Work out which ABI(s) to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          FULL='[
            {"arch":"aarch64","abi":"arm64-v8a"},
            {"arch":"arm","abi":"armeabi-v7a"},
            {"arch":"x86_64","abi":"x86_64"}
          ]'
          SEL="${{ inputs.arch }}"
          if [ -z "$SEL" ] || [ "$SEL" = "all" ]; then
            MATRIX="$(echo "$FULL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)))')"
          else
            MATRIX="$(echo "$FULL" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps([x for x in d if x['arch']=='$SEL']))")"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Building for: $MATRIX"

  build-libnode:
    name: Build libnode.so (${{ matrix.arch }})
    needs: plan
    runs-on: ubuntu-latest
    # Hard runner cap is 360 minutes; leaving a 10-minute margin for
    # checkout/upload steps either side of the actual recipe.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out ARKcode
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            2>/dev/null || true
          docker image prune -a -f || true
          df -h /

      - name: Clone termux-packages (pinned commit)
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/termux/termux-packages.git termux-packages
          cd termux-packages
          if git fetch --depth 1 origin "$TERMUX_PACKAGES_COMMIT"; then
            git checkout FETCH_HEAD
          else
            echo "::warning::Pinned commit $TERMUX_PACKAGES_COMMIT unfetchable, falling back to master — recipe may not match this build system exactly."
            git fetch --depth 1 origin master
            git checkout FETCH_HEAD
          fi

      - name: Fetch the nodejs-lts recipe fresh (not git-vendored)
        run: |
          ./android-project/scripts/vendor-termux-recipe.sh
          rm -rf termux-packages/packages/nodejs-lts
          cp -r android-project/build/termux-recipe/nodejs-lts \
            termux-packages/packages/nodejs-lts

      - name: Pull the Termux package builder image
        working-directory: termux-packages
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Run the recipe (host ICU + host LLVM fetch + NDK cross-build)
        working-directory: termux-packages
        run: |
          # -I: download this recipe's TERMUX_PKG_DEPENDS
          # (libc++, openssl, c-ares, libicu, libsqlite, zlib) as
          # prebuilt packages from Termux's own repo instead of
          # building each from source — that's what actually keeps
          # this to "one recipe's worth of hours" instead of "half of
          # termux-packages' dependency graph's worth of hours". See
          # nodejs-lts/build.sh's TERMUX_PKG_DEPENDS line. Those same
          # prebuilt deps are what the node binary this produces links
          # against at runtime (readelf -d's NEEDED entries, BUG-0002)
          # -- the "Vendor this ABI's shared-library dependencies" step
          # below is what actually bundles matching copies of them
          # into this job's jniLibs output; this step only produces
          # node itself.
          ./scripts/run-docker.sh ./build-package.sh -I -a "${{ matrix.arch }}" nodejs-lts

      - name: Extract the node binary from the built .deb
        working-directory: termux-packages
        run: |
          set -eu
          DEB="$(find output -maxdepth 1 -name 'nodejs-lts*.deb' | head -n1)"
          if [ -z "$DEB" ]; then
            echo "::error::No nodejs-lts*.deb found under termux-packages/output — build likely failed before packaging."
            find output -maxdepth 1 || true
            exit 1
          fi
          echo "Built package: $DEB"
          mkdir -p extracted
          ar x "$DEB" --output=extracted
          cd extracted
          # Termux has used xz, zstd, and (rarely) gzip for data.tar.*
          # across its history — try each rather than assuming one.
          for CANDIDATE in data.tar.xz data.tar.zst data.tar.gz; do
            if [ -f "$CANDIDATE" ]; then
              tar --auto-compress -xf "$CANDIDATE"
              break
            fi
          done
          NODE_BIN="$(find . -type f -path '*/bin/node' | head -n1)"
          if [ -z "$NODE_BIN" ]; then
            echo "::error::data.tar.* extracted but no bin/node inside it."
            find . -maxdepth 6 || true
            exit 1
          fi
          cp "$NODE_BIN" "../libnode.so"
          cd ..
          file libnode.so
          ls -lh libnode.so "$DEB"

      # This ABI's libnode.so is only half of BUG-0002's fix -- the
      # binary above is dynamically linked against 8 shared libraries
      # (openssl, icu, c-ares, sqlite, zlib, libc++) that no stock
      # Android device ships. scripts/vendor-termux-libs.sh already
      # knew how to fetch these (it just defaulted to arm64-v8a/
      # aarch64 only, since that was the only ABI anything vendored
      # libnode.so for at the time it was written) -- this patch
      # parameterizes it so this same script, called once per matrix
      # arch/abi here, fetches the RIGHT arch's libraries for whichever
      # ABI this job is building, instead of the arm64-v8a build
      # relying on it and armeabi-v7a/x86_64 having no equivalent path
      # to their own shared-lib deps at all.
      - name: Vendor this ABI's Termux shared-library dependencies
        run: |
          ./android-project/scripts/vendor-termux-libs.sh "${{ matrix.arch }}" "${{ matrix.abi }}"

      # Stage libnode.so and its shared-library deps together, flat,
      # in one directory -- this is what actually ships as this ABI's
      # artifact. Deliberately NOT reusing termux-packages/ or
      # android-project/app/src/main/jniLibs/<abi>/ directly as the
      # upload root: actions/upload-artifact computes its packed
      # layout from the least-common-ancestor of every path handed to
      # it, and those two directories only share the repo root as a
      # common ancestor -- uploading both as-is would nest the result
      # under termux-packages/ and android-project/... subpaths,
      # breaking the `bundle` job's existing flat `$DIR/libnode.so`
      # assumption below. A dedicated staging/ directory keeps this
      # job's output flat regardless of where its inputs happened to
      # land.
      - name: Stage this ABI's jniLibs output
        run: |
          set -eu
          mkdir -p staging
          cp termux-packages/libnode.so staging/
          cp android-project/app/src/main/jniLibs/${{ matrix.abi }}/lib* staging/
          echo "Staged for ${{ matrix.abi }}:"
          ls -lh staging/

      - name: Upload jniLibs bundle (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: libnode.so-${{ matrix.abi }}
          path: staging
          if-no-files-found: error

      # Kept separate from the jniLibs bundle above (own artifact,
      # own name) -- the `bundle` job below only ever wants the flat
      # staging/ layout, and the .deb is provenance/debugging
      # material, not something Gradle or IdeBackendService ever
      # touches.
      - name: Upload built .deb (${{ matrix.abi }}, provenance)
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-lts-deb-${{ matrix.abi }}
          path: termux-packages/output/nodejs-lts*.deb
          if-no-files-found: error

  bundle:
    name: Bundle into a jniLibs/ layout
    needs: build-libnode
    if: always() && needs.build-libnode.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download every ABI's artifact
        uses: actions/download-artifact@v4
        with:
          pattern: libnode.so-*
          path: downloaded

      - name: Arrange as app/src/main/jniLibs/<abi>/
        run: |
          set -eu
          mkdir -p jniLibs
          for DIR in downloaded/libnode.so-*; do
            ABI="$(basename "$DIR" | sed 's/^libnode.so-//')"
            mkdir -p "jniLibs/$ABI"
            # Copies libnode.so AND its staged shared-library deps
            # together -- see the "Stage this ABI's jniLibs output"
            # step above for why $DIR is already flat and needs no
            # further filtering here.
            cp "$DIR"/* "jniLibs/$ABI/"
          done
          find jniLibs -type f -exec ls -lh {} \;

      - name: Upload combined jniLibs bundle
        uses: actions/upload-artifact@v4
        with:
          name: libnode-jniLibs
          path: jniLibs
          if-no-files-found: error
